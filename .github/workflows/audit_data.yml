name: 競輪CSVデータ監査

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'keirin_data/**'
      - 'scripts/**'
      - '.github/workflows/audit_data.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 選手名・府県パーサーテスト
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: CSV品質監査
        run: python scripts/audit_data.py

      - name: 監査レポートを保存
        uses: actions/upload-artifact@v4
        with:
          name: keirin-data-audit-report
          path: keirin_data/audit_report.json
          if-no-files-found: error
          retention-days: 30
